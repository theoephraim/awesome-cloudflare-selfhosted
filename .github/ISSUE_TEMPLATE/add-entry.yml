# Generated by scripts/build.js from data/categories/ -- do not edit by hand.
name: Add an entry
description: Suggest an app for the list
title: "Add: owner/repo"
labels: ["submission"]
body:
  - type: markdown
    attributes:
      value: |
        The list is generated from `data/`, so there is no file for you to write.
        Fill this in and a bot checks the repository, builds the entry and opens the
        pull request.

        It checks the things a machine can decide: an open-source license (or none,
        which gets listed with a warning), a Cloudflare deploy configuration, recent
        activity, and that it isn't already listed. Whether the project is genuinely a
        SaaS replacement rather than a framework or template is a human call, made in
        review.

  - type: input
    id: repo
    attributes:
      label: Repository
      description: The full GitHub URL, so it is a link in the issue. `owner/name` works too.
      placeholder: https://github.com/owner/name
    validations:
      required: true

  - type: input
    id: name
    attributes:
      label: Name
      description: >-
        Optional. What the project calls itself, if that is not the repository name --
        `RepoAccess`, not `repoaccess-core`. Left blank, the repository name is used.
      placeholder: RepoAccess
    validations:
      required: false

  - type: dropdown
    id: category
    attributes:
      label: Category
      description: Where it belongs in the list.
      options:
        - "Analytics"
        - "Auth, secrets and security"
        - "Blogs, CMS and docs"
        - "Business and operations"
        - "Chat and realtime"
        - "Community and comments"
        - "Developer tools"
        - "Email and inboxes"
        - "Files, images and sharing"
        - "Link shorteners"
        - "Notes, knowledge and sync"
        - "Notifications and push"
        - "Remote access"
        - "Uptime and status pages"
        - "Personal"
    validations:
      required: true

  - type: textarea
    id: summary
    attributes:
      label: What it replaces, in one sentence
      description: >-
        One sentence, on one line. Lead with the product it stands in for when there is
        an obvious one. Say what it does, not how it feels about it -- no "blazing fast",
        no "modern", no "simple".
      placeholder: Calendly alternative for a single team, with booking pages rendered at the edge.
    validations:
      required: true

  - type: textarea
    id: notes
    attributes:
      label: Anything else
      description: >-
        Optional. Tell us if you maintain this project -- that is welcome, it just goes
        on the record. Also the place to explain an unusual deploy setup.
    validations:
      required: false
